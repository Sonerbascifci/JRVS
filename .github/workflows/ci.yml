name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Restore
        run: dotnet restore Jarvis.sln

      - name: Build
        run: dotnet build Jarvis.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Jarvis.sln --configuration Release --no-build
